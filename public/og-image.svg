<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Sonicly — музыка без регистрации">
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08080c" />
      <stop offset="60%" stop-color="#140d24" />
      <stop offset="100%" stop-color="#062028" />
    </linearGradient>
    <radialGradient id="glowA" cx="18%" cy="12%" r="62%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowB" cx="88%" cy="92%" r="58%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.4" />
