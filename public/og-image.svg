    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="55%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#22D3EE" />
