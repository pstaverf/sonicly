  <text x="96" y="352" font-family="Manrope, Inter, system-ui, sans-serif" font-size="82" font-weight="800" fill="#f5f5f7" letter-spacing="-2">Sonicly</text>
  <text x="96" y="418" font-family="Manrope, Inter, system-ui, sans-serif" font-size="34" font-weight="500" fill="#c9c9d4">Музыка без регистрации: Jamendo и Audius</text>
  <text x="96" y="474" font-family="Manrope, Inter, system-ui, sans-serif" font-size="26" font-weight="400" fill="#8b8b9c">Треки, альбомы, артисты и плейлисты под лицензиями Creative Commons</text>

  <g transform="translate(96 522)">
